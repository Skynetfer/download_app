
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tải RinoDigi</title>
</head>
<body>
  <p>Đang chuyển đến cửa hàng ứng dụng...</p>

  <script>
    const ua = navigator.userAgent || "";

    const iosUrl =
      "https://apps.apple.com/vn/app/rinodigi-ti%E1%BA%BFng-anh-cho-tr%E1%BA%BB-em/id6752601786?l=vi";

    const androidUrl =
      "https://play.google.com/store/apps/details?id=ai.rinoedu.digi&hl=vi";

    if (/iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) {
      window.location.replace(iosUrl);
    } else if (/Android/i.test(ua)) {
      window.location.replace(androidUrl);
    } else {
      document.body.innerHTML = `
        <h2>Tải RinoDigi</h2>
        <p><a href="${iosUrl}">Tải trên App Store</a></p>
        <p><a href="${androidUrl}">Tải trên Google Play</a></p>
      `;
    }
  </script>
</body>
</html>
